<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快捷複製常用語</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 0px;
            background-color: #e6e6e9;
            margin: 0;
        }

        h2 {
            color: #333;
            font-size: 18px;
            text-align: left;
            padding: 0px 20px;
            margin-top: 24px;
            /* 稍微增加標題上方的間距，讓排版更透氣 */
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding-bottom: 30px;
            /* 底部留白，避免按鈕被手機底部的系統列擋住 */
        }

        /* 針對手機觸控優化的按鈕樣式 */
        .copy-btn {
            background-color: #ffffff;
            color: #333333;
            border: 0px solid #ddd;
            padding: 16px 20px;
            font-size: 15px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
            /* 移除手機點擊時的藍色高亮 */
        }

        /* 點擊時的視覺回饋 */
        .copy-btn:active {
            background-color: #e9e9eb;
            transform: scale(0.98);
        }

        /* 複製成功後的動態提示泡泡 */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
        }
    </style>
</head>

<body>
    <div class="btn-container">
        <h2>問候</h2>
        <button class="copy-btn" data-text="您好，東西還在">
            您好，東西還在
        </button>

        <button class="copy-btn" data-text="請問您方便約什麼時候面交呢？">
            請問您方便約什麼時候面交呢？
        </button>

        <button class="copy-btn" data-text="您好，東西還在，請問您方便約什麼時候面交呢？">
            您好，東西還在，請問您方便約什麼時候面交呢？
        </button>

        <h2>約地點</h2>
        <!-- 使用 &#10; 來取代真實換行，避免複製到無謂的空白縮排 -->
        <button class="copy-btn" data-text="可以約在這間心樸超市面交&#10;https://maps.app.goo.gl/Nngq44JFvZTtVmBz7">
            可以約在這間心樸超市面交<br>
            <span style="font-size: 13px; color: #666;">(附地圖連結)</span>
        </button>

        <button class="copy-btn" data-text="可以約在這間咖啡店門口，我再帶您上樓看實品&#10;https://maps.app.goo.gl/tHdoYWAG2EeJ9ZGs6">
            可以約在這間咖啡店門口，我再帶您上樓看實品<br>
            <span style="font-size: 13px; color: #666;">(附地圖連結)</span>
        </button>

        <h2>議價</h2>
        <button class="copy-btn" data-text="不好意思，因為目前想先以整組賣為主，預計 2~3 週後視情況開放單賣。您可以先儲存貼文，我也會再通知您，謝謝您的詢問">
            不好意思，因為目前想先以整組賣為主，預計 2~3 週後視情況開放單賣。您可以先儲存貼文，我也會再通知您，謝謝您的詢問
        </button>

        <button class="copy-btn" data-text="您好，因為還有別人在問，若是之後沒有賣出，會再更新貼文降價，謝謝">
            您好，因為還有別人在問，若是之後沒有賣出，會再更新貼文降價，謝謝
        </button>

        <button class="copy-btn" data-text="不好意思，這件商品已經售出了">
            不好意思，這件商品已經售出了
        </button>
    </div>

    <div id="toast" class="toast">已複製到剪貼簿</div>

    <script>
        const buttons = document.querySelectorAll('.copy-btn');
        const toast = document.getElementById('toast');
        let toastTimeout; // 新增一個變數用來儲存計時器

        buttons.forEach(button => {
            button.addEventListener('click', async () => {
                const textToCopy = button.getAttribute('data-text');

                try {
                    await navigator.clipboard.writeText(textToCopy);
                    showToast();
                } catch (err) {
                    alert('複製失敗，請手動複製。');
                    console.error('無法複製文字: ', err);
                }
            });
        });

        function showToast() {
            toast.classList.add('show');

            // 如果已經有計時器在倒數，先把它清掉，避免提早關閉泡泡
            if (toastTimeout) {
                clearTimeout(toastTimeout);
            }

            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 1500);
        }
    </script>
</body>

</html>
