<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快捷複製常用語</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 0px;
            background-color: #e6e6e9;
            margin: 0;
        }
        h2 {
            color: #333;
            font-size: 18px;
            text-align: left;
            padding: 0px 20px;
        }
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        /* 針對手機觸控優化的按鈕樣式 */
        .copy-btn {
            background-color: #ffffff;
            color: #333333;
            border: 0px solid #ddd;
            padding: 16px 20px;
            font-size: 15px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent; /* 移除手機點擊時的藍色高亮 */
        }
        /* 點擊時的視覺回饋 */
        .copy-btn:active {
            background-color: #e9e9eb;
            transform: scale(0.98);
        }
        /* 複製成功後的動態提示泡泡 */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 1000;
        }
        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="btn-container">
        <h2>問候</h2>
        <button class="copy-btn" data-text="您好，東西還在">
            您好，東西還在
        </button>

        <button class="copy-btn" data-text="請問您方便約什麼時候面交呢？">
            請問您方便約什麼時候面交呢？
        </button>
        
        <button class="copy-btn" data-text="您好，東西還在，請問您方便約什麼時候面交呢？">
            您好，東西還在，請問您方便約什麼時候面交呢？
        </button>

        <h2>約地點</h2>
        <button class="copy-btn" data-text="可以約在這間心樸超市面交
https://maps.app.goo.gl/Nngq44JFvZTtVmBz7">
            可以約在這間心樸超市面交
        </button>

        <button class="copy-btn" data-text="或是捷運大安站 6 號出口">
            或是捷運大安站 6 號出口
        </button>

        <h2>結尾</h2>
        <button class="copy-btn" data-text="您好，因為還有別人在問，若是之後沒有賣出，會再更新貼文降價，謝謝">
            您好，因為還有別人在問，若是之後沒有賣出，會再更新貼文降價，謝謝
        </button>
        
        <button class="copy-btn" data-text="不好意思，這件商品已經售出了">
            不好意思，這件商品已經售出了
        </button>
    </div>

    <div id="toast" class="toast">已複製到剪貼簿</div>

    <script>
        // 取得畫面上所有帶有 copy-btn 類別的按鈕
        const buttons = document.querySelectorAll('.copy-btn');
        const toast = document.getElementById('toast');

        buttons.forEach(button => {
            button.addEventListener('click', async () => {
                // 取得按鈕中 data-text 的文字內容
                const textToCopy = button.getAttribute('data-text');
                
                try {
                    // 執行複製到剪貼簿
                    await navigator.clipboard.writeText(textToCopy);
                    
                    // 顯示「已複製」提示泡泡
                    showToast();
                } catch (err) {
                    alert('複製失敗，請手動複製。');
                    console.error('無法複製文字: ', err);
                }
            });
        });

        // 控制提示泡泡顯示與隱藏的函式
        function showToast() {
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 1500); // 1.5 秒後自動隱藏
        }
    </script>

</body>
</html>
